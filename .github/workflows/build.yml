name: Build APK
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # هر دوشنبه: APK تازه با فهرست‌های به‌روز
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            ZIP=$(ls ./*.zip | sort -V | tail -1)
            mkdir project
            unzip -q "$ZIP" -d project
            D=$(dirname "$(find project -name settings.gradle.kts | head -1)")
            echo "PROJECT_DIR=$D" >> $GITHUB_ENV
          fi
      - name: Tool tests (Python)
        run: python3 -m unittest discover -s tools -v
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Refresh bundled domain list from public sources
        # اگر دانلود یا اعتبارسنجی شکست بخورد، همان seed داخل مخزن استفاده می‌شود
        run: python3 tools/build_domain_list.py || echo "Using the committed seed list"
        working-directory: ${{ env.PROJECT_DIR }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        run: gradle assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: doorOBlock-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
      - name: Unit tests
        run: gradle test
        working-directory: ${{ env.PROJECT_DIR }}
