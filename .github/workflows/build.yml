name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            ZIP=$(ls ./*.zip | sort -V | tail -1)
            mkdir project
            unzip -q "$ZIP" -d project
            D=$(dirname "$(find project -name settings.gradle.kts | head -1)")
            echo "PROJECT_DIR=$D" >> $GITHUB_ENV
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        run: gradle assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: doorOBlock-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
      - name: Unit tests
        run: gradle test
        working-directory: ${{ env.PROJECT_DIR }}
